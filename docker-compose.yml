version: "3.9"

services:
  gite:
    build: .
    container_name: gite-server
    restart: unless-stopped
    ports:
      - "2222:2222"   # SSH git transport
      - "3000:3000"   # HTTP web / smart-HTTP (Phase 1)
    volumes:
      - gite-data:/data
    environment:
      - GITE_HOME=/data
      - GITE_LOG_LEVEL=info
      - GITE_LOG_FORMAT=json

volumes:
  gite-data:

