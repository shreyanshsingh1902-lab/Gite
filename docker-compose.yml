services:
  ssh-server:
    image: linuxserver/openssh-server:latest
    container_name: ssh-test-server
    ports:
      - "2222:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=majinBuu # user matching the Go code
    volumes:
      - .temp/sshKey.pub:/config/.ssh/authorized_keys
    restart: unless-stopped

